name: Build NVR Qwen Windows Launcher

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "crates/runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-nvr-qwen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 executable
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build launcher
        run: cargo build --release --bin nvr-qwen

      - name: Prepare executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/nvr-qwen.exe dist/NVR-Qwen.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NVR-Qwen-Windows-x64
          path: dist/NVR-Qwen.exe
          if-no-files-found: error
          retention-days: 30
