name: Rust CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux file-dialog build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
