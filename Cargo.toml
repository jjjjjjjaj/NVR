[workspace]
resolver = "2"
members = ["apps/cli", "crates/runtime", "crates/benchmark", "crates/model-catalog"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jjjjjjjaj/NVR"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
